<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">EdgeVol architecture</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/>
    </marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
      .h { font-size: 20px; font-weight: 700; }
      .b { font-size: 17px; font-weight: 600; }
      .s { font-size: 13px; fill: #4B5563; }
      .m { font-size: 12.5px; font-family: "SF Mono", Menlo, Consolas, monospace; fill: #374151; }
      .cap { font-size: 12px; font-weight: 700; letter-spacing: 1.5px; fill: #6B7280; }
      .lbl { font-size: 12px; fill: #4B5563; font-style: italic; }
      .card { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 1.5; }
      .line { stroke: #4B5563; stroke-width: 2; fill: none; }
      .dash { stroke: #9CA3AF; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#F8F8FC"/>
  <text x="60" y="48" class="h">EdgeVol · architecture (edge handle → Android's own volume panel)</text>

  <!-- Row 1: triggers -->
  <text x="60" y="88" class="cap">TRIGGERS</text>
  <rect x="60"  y="100" width="320" height="90" rx="14" class="card"/>
  <rect x="60"  y="100" width="8" height="90" rx="4" fill="#6366F1"/>
  <text x="84"  y="128" class="b">Edge handle</text>
  <text x="84"  y="152" class="s">tap · hold &amp; drag to move</text>
  <text x="84"  y="173" class="s">TalkBack: show panel · move actions</text>

  <rect x="440" y="100" width="320" height="90" rx="14" class="card"/>
  <rect x="440" y="100" width="8" height="90" rx="4" fill="#9CA3AF"/>
  <text x="464" y="128" class="b">Launcher icon</text>
  <text x="464" y="152" class="m">MainActivity · SetupScreen</text>
  <text x="464" y="173" class="s">status · edits Prefs · turns handle on</text>

  <rect x="820" y="100" width="320" height="90" rx="14" class="card"/>
  <rect x="820" y="100" width="8" height="90" rx="4" fill="#6366F1"/>
  <text x="844" y="128" class="b">Quick Settings tile</text>
  <text x="844" y="152" class="m">VolumeTileService</text>
  <text x="844" y="173" class="s">shows / hides the handle</text>

  <!-- Row 2: host service -->
  <rect x="60" y="246" width="700" height="250" rx="18" fill="#EEF0FF" stroke="#6366F1" stroke-width="2"/>
  <text x="84" y="276" class="b">VolumeAccessibilityService</text>
  <text x="84" y="296" class="s">bound by the system · canRetrieveWindowContent = false (never reads the screen)</text>

  <rect x="84" y="312" width="260" height="56" rx="12" class="card"/>
  <text x="104" y="336" class="b">EdgeHandleView</text>
  <text x="104" y="356" class="s">touch · haptics · TalkBack actions</text>
  <rect x="84" y="388" width="260" height="56" rx="12" class="card"/>
  <text x="104" y="412" class="b">HandleGestures</text>
  <text x="104" y="432" class="s">tap · hold · drag (pure Kotlin)</text>

  <rect x="372" y="312" width="364" height="100" rx="12" class="card"/>
  <text x="392" y="336" class="b">OverlayController</text>
  <text x="392" y="358" class="m">apply(prefs): show · update · remove</text>
  <text x="392" y="378" class="m">TYPE_ACCESSIBILITY_OVERLAY window</text>
  <text x="392" y="398" class="s">exactly one window · relayout() on rotation</text>
  <rect x="372" y="424" width="364" height="56" rx="12" class="card"/>
  <text x="392" y="448" class="b">HandleSnap</text>
  <text x="392" y="468" class="s">nearer side + height % (10–90%)</text>

  <path d="M372,340 L346,340" class="line" marker-end="url(#arr)"/>
  <path d="M214,368 L214,386" class="line" marker-end="url(#arr)"/>
  <path d="M344,434 L370,434" class="line" marker-end="url(#arr)"/>

  <!-- Prefs / DataStore -->
  <rect x="820" y="246" width="320" height="250" rx="14" class="card" stroke="#6366F1"/>
  <text x="844" y="276" class="b">Prefs (DataStore)</text>
  <text x="844" y="298" class="m">PrefsRepository</text>
  <text x="844" y="326" class="s">side · height % · size · opacity</text>
  <text x="844" y="346" class="s">handleEnabled (show / hide)</text>
  <text x="844" y="394" class="s">written by the setup screen,</text>
  <text x="844" y="414" class="s">the tile and a finished drag</text>
  <text x="844" y="446" class="s">the service collects its Flow</text>
  <text x="844" y="466" class="s">and applies every change live</text>

  <path d="M820,362 L738,362" class="line" marker-end="url(#arr)"/>
  <text x="790" y="354" class="lbl" text-anchor="middle">Flow</text>

  <!-- Row 1 -> Row 2 arrows -->
  <path d="M220,190 L220,244" class="line" marker-end="url(#arr)"/>
  <text x="230" y="222" class="lbl">touch events</text>
  <path d="M520,190 L520,244" class="dash" marker-end="url(#arr)"/>
  <text x="530" y="222" class="lbl">reads status</text>
  <path d="M700,190 L700,214 L880,214 L880,244" class="line" marker-end="url(#arr)"/>
  <text x="770" y="234" class="lbl">edits (live)</text>
  <path d="M1000,190 L1000,244" class="line" marker-end="url(#arr)"/>
  <text x="1010" y="222" class="lbl">handleEnabled</text>

  <!-- Row 2 -> Prefs (snap) and -> Row 3 (tap) -->
  <path d="M560,480 L560,518 L980,518 L980,498" class="line" marker-end="url(#arr)"/>
  <text x="580" y="536" class="lbl">finished drag → repository.update(side, height %)</text>
  <path d="M214,444 L214,550" class="line" marker-end="url(#arr)"/>
  <text x="224" y="528" class="lbl">tap → showPanel()</text>

  <!-- Row 3 -->
  <rect x="60"  y="552" width="460" height="80" rx="14" class="card" stroke="#6366F1"/>
  <text x="84"  y="580" class="b">SystemVolume</text>
  <text x="84"  y="602" class="m">showPanel(): ADJUST_SAME + FLAG_SHOW_UI</text>
  <text x="84"  y="622" class="s">same path as the hardware volume keys</text>

  <rect x="600" y="552" width="540" height="80" rx="14" fill="#FFFFFF" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="624" y="580" class="cap">NOT USED</text>
  <text x="624" y="602" class="s">no SYSTEM_ALERT_WINDOW · no foreground notification</text>
  <text x="624" y="622" class="s">no INTERNET permission · no analytics or trackers</text>

  <!-- Row 4: Android -->
  <rect x="60" y="668" width="1080" height="120" rx="18" fill="#F1F5F9" stroke="#94A3B8" stroke-width="1.5"/>
  <text x="1116" y="696" class="cap" text-anchor="end">ANDROID SYSTEM</text>
  <rect x="84"  y="712" width="230" height="46" rx="23" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="199" y="741" class="b" text-anchor="middle">AudioManager</text>
  <rect x="364" y="706" width="330" height="58" rx="29" fill="#EEF0FF" stroke="#6366F1" stroke-width="2"/>
  <text x="529" y="731" class="b" text-anchor="middle">SystemUI volume panel</text>
  <text x="529" y="751" class="s" text-anchor="middle">the phone's own UI (look varies by OEM)</text>
  <rect x="744" y="712" width="170" height="46" rx="23" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="829" y="741" class="b" text-anchor="middle">WindowManager</text>
  <rect x="934" y="712" width="182" height="46" rx="23" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1025" y="741" class="b" text-anchor="middle">SystemUI · QS</text>

  <path d="M199,632 L199,710" class="line" marker-end="url(#arr)"/>
  <text x="210" y="657" class="lbl">adjustSuggestedStreamVolume(ADJUST_SAME, USE_DEFAULT_STREAM_TYPE, FLAG_SHOW_UI)</text>
  <path d="M314,735 L362,735" class="line" marker-end="url(#arr)"/>
</svg>
