<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="t">
  <title id="t">EdgeVol first-run onboarding flow</title>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
      .h { font-size: 20px; font-weight: 700; }
      .t { font-size: 15px; font-weight: 700; }
      .s { font-size: 12.5px; fill: #4B5563; }
      .n { font-size: 15px; font-weight: 700; fill: #FFFFFF; }
      .row { font-size: 14px; font-weight: 600; }
      .chip { font-size: 12.5px; font-weight: 700; }
      .ctl { font-size: 13px; }
      .seg { font-size: 11.5px; font-weight: 600; }
      .req { fill: #FFFFFF; stroke: #6366F1; stroke-width: 2; }
      .opt { fill: #FFFFFF; stroke: #9CA3AF; stroke-width: 2; stroke-dasharray: 7 5; }
      .line { stroke: #6B7280; stroke-width: 2; fill: none; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/><stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="870" fill="#F8F8FC"/>
  <text x="40" y="48" class="h">EdgeVol · first-run onboarding (sideloaded APK) · one permission only</text>

  <!-- step cards: x = 40 + i*192, w = 164, y = 80, h = 220 -->
  <rect x="40" y="80" width="164" height="220" rx="16" class="req"/>
  <circle cx="68" cy="110" r="16" fill="#6366F1"/><text x="68" y="115" class="n" text-anchor="middle">1</text>
  <text x="56" y="152" class="t">Install APK</text>
  <text x="56" y="178" class="s">adb install app.apk</text>
  <text x="56" y="198" class="s">or open the .apk file</text>
  <text x="56" y="218" class="s">on the phone</text>

  <rect x="232" y="80" width="164" height="220" rx="16" class="req"/>
  <circle cx="260" cy="110" r="16" fill="#6366F1"/><text x="260" y="115" class="n" text-anchor="middle">2</text>
  <text x="248" y="152" class="t">Open EdgeVol</text>
  <text x="248" y="178" class="s">Setup screen shows</text>
  <text x="248" y="198" class="s">the live status:</text>
  <text x="248" y="218" class="s">Off · On but not</text>
  <text x="248" y="238" class="s">running · On</text>

  <rect x="424" y="80" width="164" height="220" rx="16" class="opt"/>
  <circle cx="452" cy="110" r="16" fill="#9CA3AF"/><text x="452" y="115" class="n" text-anchor="middle">3</text>
  <text x="440" y="152" class="t">Restricted settings</text>
  <text x="440" y="178" class="s">Android 13+, only if</text>
  <text x="440" y="198" class="s">the toggle is greyed</text>
  <text x="440" y="218" class="s">out: App info → ⋮ →</text>
  <text x="440" y="238" class="s">Allow restricted</text>
  <text x="440" y="258" class="s">settings</text>

  <rect x="616" y="80" width="164" height="220" rx="16" class="req"/>
  <circle cx="644" cy="110" r="16" fill="#6366F1"/><text x="644" y="115" class="n" text-anchor="middle">4</text>
  <text x="632" y="152" class="t">Enable service</text>
  <text x="632" y="178" class="s">Settings →</text>
  <text x="632" y="198" class="s">Accessibility →</text>
  <text x="632" y="218" class="s">EdgeVol → On;</text>
  <text x="632" y="238" class="s">the handle appears</text>
  <text x="632" y="258" class="s">immediately</text>

  <rect x="808" y="80" width="164" height="220" rx="16" class="opt"/>
  <circle cx="836" cy="110" r="16" fill="#9CA3AF"/><text x="836" y="115" class="n" text-anchor="middle">5</text>
  <text x="824" y="152" class="t">Keep it running</text>
  <text x="824" y="178" class="s">Xiaomi / Redmi / POCO</text>
  <text x="824" y="198" class="s">only: allow Autostart</text>
  <text x="824" y="218" class="s">and lock the EdgeVol</text>
  <text x="824" y="238" class="s">card in Recents, so</text>
  <text x="824" y="258" class="s">clearing recent apps</text>
  <text x="824" y="278" class="s">doesn't stop it</text>

  <rect x="1000" y="80" width="164" height="220" rx="16" class="opt"/>
  <circle cx="1028" cy="110" r="16" fill="#9CA3AF"/><text x="1028" y="115" class="n" text-anchor="middle">6</text>
  <text x="1016" y="152" class="t">Add QS tile</text>
  <text x="1016" y="178" class="s">one-tap system prompt</text>
  <text x="1016" y="198" class="s">on Android 13+, else</text>
  <text x="1016" y="218" class="s">edit Quick Settings</text>
  <text x="1016" y="238" class="s">tiles manually</text>

  <g>
    <path d="M206,190 L230,190" class="line" marker-end="url(#arr)"/>
    <path d="M398,190 L422,190" class="line" marker-end="url(#arr)"/>
    <path d="M590,190 L614,190" class="line" marker-end="url(#arr)"/>
    <path d="M782,190 L806,190" class="line" marker-end="url(#arr)"/>
    <path d="M974,190 L998,190" class="line" marker-end="url(#arr)"/>
  </g>

  <!-- ready banner -->
  <path d="M1082,302 L1082,330" class="line" marker-end="url(#arr)"/>
  <rect x="780" y="334" width="384" height="44" rx="22" fill="#DCFCE7" stroke="#16A34A" stroke-width="1.5"/>
  <text x="972" y="362" class="row" text-anchor="middle" style="fill:#166534">✓ Ready: tap the handle in any app</text>

  <!-- setup screen mock -->
  <rect x="40" y="400" width="680" height="440" rx="20" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
  <rect x="64" y="420" width="32" height="32" rx="8" fill="url(#bg)"/>
  <g fill="#FFFFFF"><rect x="71" y="429" width="4" height="15" rx="2"/><rect x="78" y="425" width="4" height="19" rx="2"/><rect x="85" y="433" width="4" height="11" rx="2"/></g>
  <text x="108" y="443" style="font-size:18px;font-weight:700">EdgeVol setup</text>
  <text x="560" y="443" class="s">MainActivity (Compose)</text>

  <rect x="64" y="468" width="632" height="42" rx="12" fill="#F5F3FF"/>
  <text x="84" y="494" class="row">Accessibility service: <tspan style="fill:#16A34A">On ✓</tspan></text>

  <!-- Handle card -->
  <rect x="64" y="518" width="632" height="202" rx="12" fill="#F5F3FF"/>
  <text x="84" y="544" class="row">Handle</text>

  <text x="84" y="572" class="ctl">Show handle</text>
  <rect x="640" y="556" width="40" height="22" rx="11" fill="#6366F1"/>
  <circle cx="669" cy="567" r="8" fill="#FFFFFF"/>

  <text x="84" y="606" class="ctl">Side</text>
  <rect x="560" y="589" width="120" height="24" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.2"/>
  <rect x="620" y="589" width="60" height="24" rx="12" fill="#6366F1"/>
  <text x="590" y="605" class="seg" text-anchor="middle" style="fill:#4338CA">Left</text>
  <text x="650" y="605" class="seg" text-anchor="middle" style="fill:#FFFFFF">Right</text>

  <text x="84" y="640" class="ctl">Height: 40%</text>
  <rect x="400" y="633" width="280" height="4" rx="2" fill="#DDD6FE"/>
  <rect x="400" y="633" width="105" height="4" rx="2" fill="#6366F1"/>
  <circle cx="505" cy="635" r="8" fill="#6366F1"/>

  <text x="84" y="674" class="ctl">Size</text>
  <rect x="470" y="657" width="210" height="24" rx="12" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.2"/>
  <rect x="540" y="657" width="70" height="24" rx="12" fill="#6366F1"/>
  <text x="505" y="673" class="seg" text-anchor="middle" style="fill:#4338CA">Small</text>
  <text x="575" y="673" class="seg" text-anchor="middle" style="fill:#FFFFFF">Medium</text>
  <text x="645" y="673" class="seg" text-anchor="middle" style="fill:#4338CA">Large</text>

  <text x="84" y="708" class="ctl">Opacity: 35%</text>
  <rect x="400" y="701" width="280" height="4" rx="2" fill="#DDD6FE"/>
  <rect x="400" y="701" width="100" height="4" rx="2" fill="#6366F1"/>
  <circle cx="500" cy="703" r="8" fill="#6366F1"/>

  <rect x="64" y="728" width="632" height="42" rx="12" fill="#F5F3FF"/>
  <text x="84" y="754" class="row">Quick Settings tile</text>
  <text x="240" y="754" class="s">shows / hides the handle</text>
  <rect x="590" y="736" width="90" height="26" rx="13" fill="none" stroke="#6366F1" stroke-width="1.5"/>
  <text x="635" y="754" class="chip" text-anchor="middle" style="fill:#4338CA">Add tile</text>

  <rect x="64" y="778" width="632" height="42" rx="12" fill="#F5F3FF"/>
  <text x="84" y="804" class="row">Try it</text>
  <text x="140" y="804" class="s">opens Android's own volume panel</text>
  <rect x="520" y="786" width="160" height="26" rx="13" fill="#6366F1"/>
  <text x="600" y="804" class="chip" text-anchor="middle" style="fill:#FFFFFF">Show volume panel</text>

  <!-- legend -->
  <text x="760" y="430" class="t">Legend</text>
  <rect x="760" y="446" width="48" height="30" rx="8" class="req"/>
  <text x="822" y="466" class="s">required step</text>
  <rect x="760" y="488" width="48" height="30" rx="8" class="opt"/>
  <text x="822" y="508" class="s">only if needed / optional</text>
  <text x="760" y="560" class="t">Notes</text>
  <text x="760" y="584" class="s">• The only permission is the accessibility service.</text>
  <text x="760" y="606" class="s">• It never reads screen content</text>
  <text x="760" y="624" class="s">   (canRetrieveWindowContent = false).</text>
  <text x="760" y="646" class="s">• No INTERNET permission, no trackers.</text>
  <text x="760" y="668" class="s">• Builds installed with adb usually skip step 3.</text>
</svg>
