    <rect x="98"  y="230" width="44" height="154" rx="22"/>
    <rect x="184" y="128" width="44" height="256" rx="22" opacity="0.22"/>
    <rect x="184" y="166" width="44" height="218" rx="22"/>
    <rect x="270" y="128" width="44" height="256" rx="22" opacity="0.22"/>
    <rect x="270" y="282" width="44" height="102" rx="22"/>
  </g>
  <g fill="#4F46E5" opacity="0.9">
    <circle cx="120" cy="252" r="9"/>
    <circle cx="206" cy="188" r="9"/>
    <circle cx="292" cy="304" r="9"/>
  </g>

  <!-- the hidden edge handle -->
  <rect x="400" y="186" width="14" height="140" rx="7" fill="#FFFFFF" opacity="0.85"/>
