<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t">
  <title id="t">EdgeVol interaction mockup: idle handle, tap shows the system panel, the tile hides the handle</title>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
      .h { font-size: 20px; font-weight: 700; }
      .cap { font-size: 16px; font-weight: 700; }
      .sub { font-size: 13px; fill: #4B5563; }
      .ann { font-size: 12px; fill: #4338CA; font-weight: 600; }
      .tag { font-size: 10.5px; fill: #6B7280; font-style: italic; }
    </style>
    <filter id="sh" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="vid" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C7D2FE"/>
      <stop offset="1" stop-color="#E9D5FF"/>
    </linearGradient>

    <symbol id="speaker" viewBox="-8 -8 16 16" overflow="visible">
      <path d="M-7,-2.6 h3.2 l4.3,-3.8 v12.8 l-4.3,-3.8 h-3.2 z"/>
      <path d="M2.6,-2.8 q2.4,2.8 0,5.6 M4.8,-5.2 q4.4,5.2 0,10.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="bell" viewBox="-8 -8 16 16" overflow="visible">
      <path d="M-6,3.5 h12 l-1.6,-2.2 v-3.3 a4.4,4.4 0 0 0 -8.8,0 v3.3 z"/>
      <circle cx="0" cy="5.6" r="1.6"/>
    </symbol>

    <!-- a generic app screen (280 x 600) -->
    <symbol id="app" viewBox="0 0 280 600">
      <rect width="280" height="600" rx="32" fill="#FFFFFF"/>
      <text x="26" y="30" style="font-size:13px;font-weight:600">9:41</text>
      <rect x="236" y="20" width="22" height="11" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/>
      <rect x="238.5" y="22.5" width="14" height="6" rx="1.5" fill="#111827"/>
      <rect x="20" y="50" width="240" height="136" rx="14" fill="url(#vid)"/>
      <path d="M128,102 l0,32 l26,-16 z" fill="#FFFFFF"/>
      <rect x="20" y="202" width="190" height="12" rx="6" fill="#D1D5DB"/>
      <rect x="20" y="224" width="130" height="10" rx="5" fill="#E5E7EB"/>
      <g fill="#E5E7EB">
        <rect x="20" y="262" width="64" height="42" rx="8"/><rect x="96" y="268" width="150" height="10" rx="5"/><rect x="96" y="286" width="100" height="9" rx="4.5"/>
        <rect x="20" y="322" width="64" height="42" rx="8"/><rect x="96" y="328" width="140" height="10" rx="5"/><rect x="96" y="346" width="110" height="9" rx="4.5"/>
        <rect x="20" y="382" width="64" height="42" rx="8"/><rect x="96" y="388" width="155" height="10" rx="5"/><rect x="96" y="406" width="90" height="9" rx="4.5"/>
        <rect x="20" y="442" width="64" height="42" rx="8"/><rect x="96" y="448" width="130" height="10" rx="5"/><rect x="96" y="466" width="104" height="9" rx="4.5"/>
        <rect x="20" y="502" width="64" height="42" rx="8"/><rect x="96" y="508" width="148" height="10" rx="5"/><rect x="96" y="526" width="96" height="9" rx="4.5"/>
      </g>
      <rect x="90" y="584" width="100" height="4" rx="2" fill="#111827"/>
    </symbol>
  </defs>

  <rect width="1200" height="800" fill="#F8F8FC"/>
  <text x="60" y="46" class="h">EdgeVol · interaction (EdgeVol draws only the handle; the panel is Android's own)</text>

  <!-- ========== Phone 1: idle ========== -->
  <rect x="90" y="80" width="300" height="620" rx="42" fill="#111827"/>
  <use href="#app" xlink:href="#app" x="100" y="90" width="280" height="600"/>
  <rect x="374" y="320" width="4" height="72" rx="2" fill="#6366F1" opacity="0.55"/>
  <ellipse cx="376" cy="356" rx="18" ry="50" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="5 4"/>

  <!-- ========== Phone 2: tap -> system panel ========== -->
  <rect x="450" y="80" width="300" height="620" rx="42" fill="#111827"/>
  <use href="#app" xlink:href="#app" x="460" y="90" width="280" height="600"/>
  <rect x="734" y="320" width="4" height="72" rx="2" fill="#6366F1"/>
  <circle cx="734" cy="356" r="15" fill="#6366F1" fill-opacity="0.22" stroke="#6366F1" stroke-width="2"/>
  <!-- generic system panel (Pixel-like), slightly inset from the edge -->
  <g filter="url(#sh)">
    <rect x="652" y="196" width="60" height="300" rx="30" fill="#F4F2FA"/>
  </g>
  <circle cx="682" cy="226" r="18" fill="#E2DEF0"/>
  <use href="#bell" xlink:href="#bell" x="674" y="218" width="16" height="16" fill="#3F3A56"/>
  <rect x="664" y="256" width="36" height="190" rx="18" fill="#E2DEF0"/>
  <rect x="664" y="338" width="36" height="108" rx="18" fill="#6750A4"/>
  <use href="#speaker" xlink:href="#speaker" x="674" y="420" width="16" height="16" fill="#FFFFFF" color="#FFFFFF"/>
  <g fill="#3F3A56"><circle cx="672" cy="472" r="2.4"/><circle cx="682" cy="472" r="2.4"/><circle cx="692" cy="472" r="2.4"/></g>
  <text x="682" y="514" class="tag" text-anchor="middle">system panel</text>
  <text x="682" y="528" class="tag" text-anchor="middle">(look varies by OEM)</text>

  <!-- ========== Phone 3: tile off -> handle hidden ========== -->
  <rect x="810" y="80" width="300" height="620" rx="42" fill="#111827"/>
  <use href="#app" xlink:href="#app" x="820" y="90" width="280" height="600"/>
  <!-- generic Quick Settings shade (Pixel-like) -->
  <g filter="url(#sh)">
    <rect x="820" y="90" width="280" height="240" rx="32" fill="#F4F2FA"/>
  </g>
  <text x="846" y="120" style="font-size:13px;font-weight:600">9:41</text>
  <rect x="1056" y="110" width="22" height="11" rx="3" fill="none" stroke="#111827" stroke-width="1.5"/>
  <rect x="1058.5" y="112.5" width="14" height="6" rx="1.5" fill="#111827"/>
  <rect x="840" y="136" width="240" height="28" rx="14" fill="#E2DEF0"/>
  <rect x="840" y="136" width="150" height="28" rx="14" fill="#6750A4"/>
  <rect x="840" y="176" width="118" height="48" rx="24" fill="#6750A4"/>
  <circle cx="862" cy="200" r="10" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="880" y="191" width="56" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="880" y="204" width="34" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="962" y="176" width="118" height="48" rx="24" fill="#E2DEF0"/>
  <circle cx="984" cy="200" r="10" fill="#CFC8E6"/>
  <rect x="1002" y="191" width="56" height="8" rx="4" fill="#CFC8E6"/>
  <rect x="1002" y="204" width="34" height="7" rx="3.5" fill="#CFC8E6"/>
  <!-- EdgeVol "Volume handle" tile, Off -->
  <rect x="840" y="234" width="118" height="48" rx="24" fill="#E2DEF0"/>
  <g transform="translate(850,249) scale(0.75)" fill="#3F3A56">
    <g opacity="0.35"><rect x="3" y="4" width="3" height="16" rx="1.5"/><rect x="8.5" y="4" width="3" height="16" rx="1.5"/><rect x="14" y="4" width="3" height="16" rx="1.5"/></g>
    <rect x="3" y="10.5" width="3" height="9.5" rx="1.5"/><rect x="8.5" y="6.5" width="3" height="13.5" rx="1.5"/><rect x="14" y="13.5" width="3" height="6.5" rx="1.5"/>
    <rect x="20" y="7.5" width="1.5" height="9" rx="0.75"/>
  </g>
  <text x="874" y="255" style="font-size:11px;font-weight:600;fill:#1F1B2E">Volume handle</text>
  <text x="874" y="270" style="font-size:10.5px;fill:#4B5563">Off</text>
  <rect x="835" y="229" width="128" height="58" rx="29" fill="none" stroke="#6366F1" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="962" y="234" width="118" height="48" rx="24" fill="#6750A4"/>
  <circle cx="984" cy="258" r="10" fill="#FFFFFF" fill-opacity="0.35"/>
  <rect x="1002" y="249" width="56" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.85"/>
  <rect x="1002" y="262" width="34" height="7" rx="3.5" fill="#FFFFFF" fill-opacity="0.6"/>
  <rect x="940" y="312" width="40" height="4" rx="2" fill="#9CA3AF"/>
  <!-- the screen edge: no handle -->
  <ellipse cx="1096" cy="372" rx="18" ry="44" fill="none" stroke="#9CA3AF" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1040" y="407" class="tag" text-anchor="middle">no handle</text>

  <!-- captions -->
  <text x="240"  y="740" class="cap" text-anchor="middle">1 · Idle</text>
  <text x="240"  y="764" class="sub" text-anchor="middle">only a 4 dp handle on the edge (35% opacity)</text>
  <text x="240"  y="784" class="sub" text-anchor="middle">side, height, size &amp; opacity configurable</text>

  <text x="600"  y="740" class="cap" text-anchor="middle">2 · Tap → Android's volume panel</text>
  <text x="600"  y="764" class="sub" text-anchor="middle">same panel as the hardware keys; use its</text>
  <text x="600"  y="784" class="sub" text-anchor="middle">slider, mute and ⋯ for ring / alarm / call</text>

  <text x="960"  y="740" class="cap" text-anchor="middle">3 · Tile off → handle hidden</text>
  <text x="960"  y="764" class="sub" text-anchor="middle">the Volume handle tile shows / hides it;</text>
  <text x="960"  y="784" class="sub" text-anchor="middle">long-press opens EdgeVol, which turns it on</text>
</svg>
