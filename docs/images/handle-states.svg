<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="t">
  <title id="t">EdgeVol edge handle states and gestures</title>
  <defs>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #111827; }
      .h { font-size: 20px; font-weight: 700; }
      .cap { font-size: 16px; font-weight: 700; }
      .sub { font-size: 13px; fill: #4B5563; }
      .ann { font-size: 12px; fill: #4338CA; font-weight: 600; }
      .tag { font-size: 10.5px; fill: #6B7280; font-style: italic; }
      .bar { fill: #E5E7EB; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4338CA"/>
    </marker>
    <filter id="sh" x="-40%" y="-20%" width="180%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <symbol id="speaker" viewBox="-8 -8 16 16" overflow="visible">
      <path d="M-7,-2.6 h3.2 l4.3,-3.8 v12.8 l-4.3,-3.8 h-3.2 z"/>
      <path d="M2.6,-2.8 q2.4,2.8 0,5.6 M4.8,-5.2 q4.4,5.2 0,10.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </symbol>
    <symbol id="bell" viewBox="-8 -8 16 16" overflow="visible">
      <path d="M-6,3.5 h12 l-1.6,-2.2 v-3.3 a4.4,4.4 0 0 0 -8.8,0 v3.3 z"/>
      <circle cx="0" cy="5.6" r="1.6"/>
    </symbol>
    <!-- background content for an edge close-up (226 x 340) -->
    <symbol id="edge" viewBox="0 0 240 340">
      <rect x="200" width="40" height="340" rx="20" fill="#111827"/>
      <rect width="226" height="340" rx="18" fill="#FFFFFF"/>
      <rect x="18" y="24"  width="170" height="12" rx="6" class="bar"/>
      <rect x="18" y="46"  width="120" height="10" rx="5" class="bar"/>
      <rect x="18" y="80"  width="56" height="40" rx="8" class="bar"/><rect x="86" y="86" width="120" height="10" rx="5" class="bar"/>
      <rect x="18" y="140" width="56" height="40" rx="8" class="bar"/><rect x="86" y="146" width="110" height="10" rx="5" class="bar"/>
      <rect x="18" y="200" width="56" height="40" rx="8" class="bar"/><rect x="86" y="206" width="125" height="10" rx="5" class="bar"/>
      <rect x="18" y="260" width="56" height="40" rx="8" class="bar"/><rect x="86" y="266" width="100" height="10" rx="5" class="bar"/>
    </symbol>
  </defs>

  <rect width="1200" height="560" fill="#F8F8FC"/>
  <text x="60" y="48" class="h">EdgeVol · edge handle states &amp; gestures (close-up of the right screen edge)</text>

  <!-- 1. Idle: screen edge at x = 286 -->
  <use href="#edge" x="60" y="90" width="240" height="340"/>
  <rect x="262" y="214" width="24" height="92" fill="#6366F1" fill-opacity="0.08" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="282" y="224" width="4" height="72" rx="2" fill="#6366F1" opacity="0.35"/>
  <text x="80" y="200" class="ann">visual: 4 × 72 dp, 35%</text>
  <path d="M228,204 L278,228" stroke="#4338CA" stroke-width="1.3"/>
  <text x="80" y="336" class="ann">touch target: 24 dp wide</text>
  <path d="M232,330 L264,306" stroke="#4338CA" stroke-width="1.3"/>

  <!-- 2. Tap: screen edge at x = 566 -->
  <use href="#edge" x="340" y="90" width="240" height="340"/>
  <rect x="562" y="224" width="4" height="72" rx="2" fill="#6366F1"/>
  <path d="M552,246 q-6,14 0,28 M542,240 q-10,20 0,40" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round"/>
  <!-- Android's own volume panel (generic, Pixel-like) -->
  <g filter="url(#sh)">
    <rect x="490" y="180" width="36" height="180" rx="18" fill="#F4F2FA"/>
  </g>
  <circle cx="508" cy="198" r="11" fill="#E2DEF0"/>
  <use href="#bell" x="502" y="192" width="12" height="12" fill="#3F3A56"/>
  <rect x="497" y="216" width="22" height="112" rx="11" fill="#E2DEF0"/>
  <rect x="497" y="268" width="22" height="60" rx="11" fill="#6750A4"/>
  <use href="#speaker" x="502" y="312" width="12" height="12" fill="#FFFFFF" color="#FFFFFF"/>
  <g fill="#3F3A56"><circle cx="502" cy="344" r="1.6"/><circle cx="508" cy="344" r="1.6"/><circle cx="514" cy="344" r="1.6"/></g>
  <text x="508" y="378" class="tag" text-anchor="middle">Android's panel</text>
  <text x="360" y="166" class="ann">tap: 100% opacity · haptic tick</text>
  <text x="360" y="412" class="ann">2nd tap within 1.8 s: ignored</text>

  <!-- 3. Hold, then drag: screen edge at x = 846 -->
  <use href="#edge" x="620" y="90" width="240" height="340"/>
  <rect x="842" y="224" width="4" height="72" rx="2" fill="none" stroke="#6366F1" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M834,262 C800,262 772,284 748,308" fill="none" stroke="#4338CA" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <rect x="724" y="292" width="12" height="72" rx="6" fill="#6366F1"/>
  <circle cx="730" cy="328" r="15" fill="#6366F1" fill-opacity="0.22" stroke="#6366F1" stroke-width="2"/>
  <text x="640" y="166" class="ann">hold 500 ms → 12 dp · haptic</text>
  <text x="640" y="412" class="ann">then drag anywhere</text>

  <!-- 4. Release: screen edge at x = 1126 -->
  <use href="#edge" x="900" y="90" width="240" height="340"/>
  <rect x="1046" y="292" width="12" height="72" rx="6" fill="none" stroke="#6366F1" stroke-width="1.5" stroke-dasharray="4 3"/>
  <path d="M1064,328 L1112,328" stroke="#4338CA" stroke-width="2.2" marker-end="url(#arr)"/>
  <rect x="1122" y="292" width="4" height="72" rx="2" fill="#6366F1" opacity="0.35"/>
  <text x="920" y="166" class="ann">release → nearer edge</text>
  <text x="920" y="412" class="ann">height saved: 70%</text>

  <!-- captions -->
  <text x="170"  y="470" class="cap" text-anchor="middle">Idle</text>
  <text x="170"  y="494" class="sub" text-anchor="middle">nearly invisible; wider invisible</text>
  <text x="170"  y="514" class="sub" text-anchor="middle">touch area makes it easy to hit</text>

  <text x="450"  y="470" class="cap" text-anchor="middle">Tap</text>
  <text x="450"  y="494" class="sub" text-anchor="middle">full opacity + haptic tick; Android's</text>
  <text x="450"  y="514" class="sub" text-anchor="middle">own volume panel appears</text>

  <text x="730"  y="470" class="cap" text-anchor="middle">Hold + drag</text>
  <text x="730"  y="494" class="sub" text-anchor="middle">hold 500 ms: haptic, widens to 12 dp,</text>
  <text x="730"  y="514" class="sub" text-anchor="middle">then follows the finger anywhere</text>

  <text x="1010" y="470" class="cap" text-anchor="middle">Release</text>
  <text x="1010" y="494" class="sub" text-anchor="middle">snaps to the nearer left / right edge;</text>
  <text x="1010" y="514" class="sub" text-anchor="middle">height % saved (kept on rotation)</text>
</svg>
